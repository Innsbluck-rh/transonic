[workspace]
members = ["crates/opensubsonic-client"]
resolver = "2"

[workspace.dependencies]
async-trait = "0.1"
md5 = "0.8"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "2.0.0-rc.21"
specta-typescript = "0.0.9"
tauri-specta = { version = "2.0.0-rc.21", features = ["derive", "typescript"] }

[package]
name = "transonic"
version = "0.0.1"
description = "multi-platform music player for subsonic servers"
authors = ["innsbluck"]
edition = "2021"
default-run = "transonic"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "transonic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-os = "2"
opensubsonic-client = { path = "crates/opensubsonic-client" }
reqwest = { workspace = true }
md5 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["serde", "v4"] }
specta = { workspace = true }
specta-typescript = { workspace = true }
tauri-specta = { workspace = true }
log = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
cpal = "0.17"
symphonia = { version = "0.6.0", features = ["flac", "mp3", "aac", "isomp4", "pcm", "vorbis", "ogg", "alac"] }
symphonia-adapter-libopus = { version = "0.3.0", default-features = false, features = ["bundled"] }
windows = { version = "0.61", features = [
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Variant",
] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { version = "3", features = [
    "linux-native-sync-persistent",
    "crypto-rust",
] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-app-events = "0.2"

[dev-dependencies]
mockito = "1"
tempfile = "3"
